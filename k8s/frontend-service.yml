apiVersion: v1
kind: Service
metadata:
  name: trackforge-service
  namespace: trackforge
spec:
  type: NodePort
  selector:
    app: trackforge
  ports:
    - protocol: TCP
      port: 5000          # ClusterIP port — internal cluster traffic hits this
      targetPort: 5000     # container port — where the app actually listens
      nodePort: 30500       # external port — reachable via <node-ip>:30500 (range 30000-32767)