apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: trackforge
  labels:
    app: trackforge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: trackforge
  template:
    metadata:
      labels:
        app: trackforge
    spec:
      containers:
      - name: trackforge-frontend
        image: apurv25/trackforge-frontend
        ports:
        - containerPort: 5000
        readinessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3