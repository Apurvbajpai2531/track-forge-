#Main Pipeline
name: DevSecOps Pipeline - TrackForge

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality:
    name: Code Quality
    uses: ./.github/workflows/code-quality.yml

  tests:
    name: Unit Tests
    needs: quality
    uses: ./.github/workflows/code-test.yml

  secrets-scan:
    name: Secret Scanning
    needs: quality
    uses: ./.github/workflows/secret-scanning.yml

  dependencies:
    name: Dependency Scan
    needs: tests
    uses: ./.github/workflows/dependency-scan.yml

  static-analysis:
    name: SAST - Semgrep
    needs: tests
    uses: ./.github/workflows/sast.yml
    secrets: inherit

  code-analysis:
    name: Code Analysis - SonarQube
    needs: tests
    uses: ./.github/workflows/sonar-qube.yml
    secrets: inherit

  image-scan:
    name: Docker Image Scan
    needs: tests
    uses: ./.github/workflows/docker-scans.yml
    secrets: inherit

  dynamic-analysis:
    name: DAST - OWASP ZAP
    needs: tests
    uses: ./.github/workflows/dast.yml
