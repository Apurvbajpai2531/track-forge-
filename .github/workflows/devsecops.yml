name: DevSecOps Pipeline - TrackForge

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ---------- Stage 1: Code quality gate ----------
  code-quality:
    uses: ./.github/workflows/code-quality.yml

  # ---------- Stage 2: Tests (needs quality to pass first) ----------
  code-test:
    needs: code-quality
    uses: ./.github/workflows/code-test.yml

  # ---------- Stage 3: Secret scanning (run early, independent of tests) ----------
  secret-scanning:
    needs: code-quality
    uses: ./.github/workflows/secret-scanning.yml

  # ---------- Stage 4: Security scans (run in parallel once tests pass) ----------
  dependency-scan:
    needs: code-test
    uses: ./.github/workflows/dependency-scan.yml

  sast:
    needs: code-test
    uses: ./.github/workflows/sast.yml
    secrets: inherit

  sonar-qube:
    needs: code-test
    uses: ./.github/workflows/sonar-qube.yml
    secrets: inherit

  docker-scans:
    needs: code-test
    uses: ./.github/workflows/docker-scans.yml
    secrets: inherit

  # ---------- Stage 5: DAST (needs a running instance of the app) ----------
  dast:
    needs: code-test
    uses: ./.github/workflows/dast.yml