
name: Code Tests

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: trackforge
          POSTGRES_PASSWORD: trackforge
          POSTGRES_DB: trackforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trackforge -d trackforge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create .env
        working-directory: backend
        run: |
          echo "DATABASE_URL=postgresql+psycopg2://trackforge:trackforge@localhost:5432/trackforge_test" > .env
          echo "SECRET_KEY=trackforge-backend-secret-key-change-later" >> .env

      - name: Run tests
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          python -m pytest app/tests -v
