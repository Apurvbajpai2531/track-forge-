name: DAST

on:
  workflow_call:

jobs:
  zap-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create CI env files
        run: |
          echo "SECRET_KEY=ci-dast-secret" > backend/.env
          echo "FRONTEND_SECRET_KEY=ci-dast-frontend-secret" > frontend/.env
          echo "API_TIMEOUT_SECONDS=5" >> frontend/.env

      - name: Start the stack with Docker Compose
        run: docker compose up -d --build

      - name: Show container status
        run: docker compose ps

      - name: Wait for frontend to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:80 > /dev/null; then
              echo "App is up"
              exit 0
            fi
            echo "Waiting for app... attempt $i"
            sleep 5
          done
          echo "App never became ready. Dumping logs:"
          docker compose logs
          exit 1

      - name: Run OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://localhost:80"
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap_scan_results
          cmd_options: "-a"

      - name: Tear down the stack
        if: always()
        run: docker compose down