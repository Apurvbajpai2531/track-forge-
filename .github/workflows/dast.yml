name: DAST

on:
  workflow_call:

jobs:
  zap-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create CI env files
        run: |
          echo "SECRET_KEY=ci-dast-secret" > backend/.env
          echo "FRONTEND_SECRET_KEY=ci-dast-frontend-secret" > frontend/.env
          echo "API_TIMEOUT_SECONDS=5" >> frontend/.env

      - name: Start the stack with Docker Compose
        run: docker compose up -d --build

      - name: Wait for frontend to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:80 > /dev/null; then
              echo "App is up"
              exit 0
            fi
            sleep 5
          done
          docker compose logs
          exit 1

      - name: Run OWASP ZAP baseline scan (direct docker, no GitHub reporting)
        run: |
          mkdir -p zap-report
          chmod 777 zap-report
          docker run --network=host -v $(pwd)/zap-report:/zap/wrk/:rw \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:80 -r report.html -a || true

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: zap-report/report.html

      - name: Tear down the stack
        if: always()
        run: docker compose down
