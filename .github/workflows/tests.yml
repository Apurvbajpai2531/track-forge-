name: Code Tests

on:
  workflow_call:

jobs:
  test:
    # Github runner
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trackforge
          POSTGRES_PASSWORD: trackforge
          POSTGRES_DB: trackforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trackforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backend Tests
        working-directory: backend
        env:
          DATABASE_URL: "postgresql+psycopg2://trackforge:trackforge@localhost:5432/trackforge_test"
          SECRET_KEY: "ci-test-secret-key"
        run: pytest app/tests
