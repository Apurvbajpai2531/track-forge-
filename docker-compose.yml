services:
  db:
    image: postgres:16
    container_name: trackforge-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: trackforge
      POSTGRES_PASSWORD: trackforge
      POSTGRES_DB: trackforge
    volumes:
      - trackforge-db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - trackforge-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trackforge -d trackforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trackforge-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://trackforge:trackforge@db:5432/trackforge
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - trackforge-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trackforge-frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    environment:
      API_BASE_URL: http://backend:8000/api
      API_TIMEOUT_SECONDS: "5"
    expose:
      - "5000"
    depends_on:
      - backend
    networks:
      - trackforge-net

  nginx:
    image: nginx:1.27-alpine
    container_name: trackforge-nginx
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
    networks:
      - trackforge-net

networks:
  trackforge-net:
    driver: bridge

volumes:
  trackforge-db-data:
