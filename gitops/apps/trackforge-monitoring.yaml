apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trackforge-monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Apurvbajpai2531/track-forge-.git
    targetRevision: main
    path: gitops/monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
