apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trackforge
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Apurvbajpai2531/track-forge-.git
    targetRevision: main
    path: k8s
    directory:
      exclude: "{persistentvolume.yml,pod.yml,secrets.yml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: trackforge
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
