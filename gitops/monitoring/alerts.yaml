apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: trackforge-alerts
  namespace: monitoring
spec:
  groups:
    - name: trackforge.rules
      rules:
        - alert: TrackForgeBackendDown
          expr: |
            (sum(up{namespace="trackforge", service="backend-service"}) or vector(0)) == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "TrackForge backend has no healthy targets"
            description: "Prometheus has not been able to scrape any backend pod for 2 minutes."

        - alert: TrackForgeHigh5xxRate
          expr: |
            (sum(rate(http_requests_total{namespace="trackforge", status="5xx"}[5m])) or vector(0))
              / sum(rate(http_requests_total{namespace="trackforge"}[5m])) > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "More than 5% of backend requests are failing"
            description: "5xx ratio has been above 5% for 5 minutes."

        - alert: TrackForgeHighLatency
          expr: |
            histogram_quantile(0.95, sum(rate(http_request_duration_highr_seconds_bucket{namespace="trackforge"}[5m])) by (le)) > 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Backend p95 latency is above 1s"
            description: "95th percentile request latency has been above 1 second for 5 minutes."

        - alert: TrackForgePodCrashLooping
          expr: |
            increase(kube_pod_container_status_restarts_total{namespace="trackforge"}[15m]) > 3
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ $labels.pod }} is restarting repeatedly"
            description: "Container {{ $labels.container }} restarted more than 3 times in 15 minutes."
