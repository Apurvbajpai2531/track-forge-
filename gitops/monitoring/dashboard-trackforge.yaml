apiVersion: v1
kind: ConfigMap
metadata:
  name: trackforge-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  trackforge-overview.json: |
    {
      "uid": "trackforge-overview",
      "title": "TrackForge Overview",
      "tags": ["trackforge"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "time": { "from": "now-30m", "to": "now" },
      "panels": [
        {
          "id": 1, "type": "timeseries", "title": "Requests per second (by handler)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "targets": [ { "refId": "A", "expr": "sum(rate(http_requests_total{namespace='trackforge'}[1m])) by (handler)", "legendFormat": "{{handler}}" } ]
        },
        {
          "id": 2, "type": "timeseries", "title": "p95 latency",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "targets": [ { "refId": "A", "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_highr_seconds_bucket{namespace='trackforge'}[5m])) by (le))", "legendFormat": "p95" } ]
        },
        {
          "id": 3, "type": "timeseries", "title": "5xx error ratio",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "fieldConfig": { "defaults": { "unit": "percentunit" }, "overrides": [] },
          "targets": [ { "refId": "A", "expr": "(sum(rate(http_requests_total{namespace='trackforge',status='5xx'}[5m])) or vector(0)) / sum(rate(http_requests_total{namespace='trackforge'}[5m]))", "legendFormat": "5xx ratio" } ]
        },
        {
          "id": 4, "type": "timeseries", "title": "Pod restarts (last hour)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [ { "refId": "A", "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace='trackforge'}[1h])) by (pod)", "legendFormat": "{{pod}}" } ]
        },
        {
          "id": 5, "type": "timeseries", "title": "CPU usage by pod (cores)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [ { "refId": "A", "expr": "sum(rate(container_cpu_usage_seconds_total{namespace='trackforge',container!=''}[5m])) by (pod)", "legendFormat": "{{pod}}" } ]
        },
        {
          "id": 6, "type": "timeseries", "title": "Memory usage by pod",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] },
          "targets": [ { "refId": "A", "expr": "sum(container_memory_working_set_bytes{namespace='trackforge',container!=''}) by (pod)", "legendFormat": "{{pod}}" } ]
        }
      ]
    }
