databases:
  - name: trackforge-db
    databaseName: trackforge
    user: trackforge
    plan: free

services:
  - type: web
    name: trackforge-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trackforge-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

  - type: web
    name: trackforge-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    envVars:
      - key: API_BASE_URL
        fromService:
          type: web
          name: trackforge-backend
          property: hostport
      - key: FRONTEND_SECRET_KEY
        generateValue: true
      - key: API_TIMEOUT_SECONDS
        value: "5"
