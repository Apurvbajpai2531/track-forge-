{% extends "base.html" %}
{% block title %}AI Assistant{% endblock %}

{% block content %}
<div class="chat-wrap">
  <h2>AI Assistant</h2>
  <p class="chat-sub">Ask anything about your projects, or anything else.</p>

  <div id="chat-log" class="chat-log"></div>

  <form id="chat-form" class="chat-form">
    <input type="text" id="chat-input" placeholder="Type a message..." autocomplete="off" required>
    <button type="submit">Send</button>
  </form>
</div>

<style>
  .chat-wrap { max-width: 720px; margin: 0 auto; }
  .chat-sub { color: #666; margin-bottom: 16px; }
  .chat-log {
    border: 1px solid #ddd;
    border-radius: 8px;
    height: 420px;
    overflow-y: auto;
    padding: 16px;
    margin-bottom: 12px;
    background: #fafafa;
  }
  .chat-msg { margin-bottom: 12px; line-height: 1.4; }
  .chat-msg.user { text-align: right; }
  .chat-msg .bubble {
    display: inline-block;
    padding: 8px 12px;
    border-radius: 12px;
    max-width: 80%;
    white-space: pre-wrap;
  }
  .chat-msg.user .bubble { background: #2563eb; color: #fff; }
  .chat-msg.assistant .bubble { background: #e5e7eb; color: #111; }
  .chat-msg.thinking .bubble { background: #e5e7eb; color: #888; font-style: italic; }
  .chat-form { display: flex; gap: 8px; }
  .chat-form input {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
  }
  .chat-form button {
    padding: 10px 18px;
    border: none;
    border-radius: 6px;
    background: #2563eb;
    color: #fff;
    cursor: pointer;
  }
  .chat-form button:disabled { opacity: 0.6; cursor: not-allowed; }
</style>

<script>
  const chatLog = document.getElementById("chat-log");
  const chatForm = document.getElementById("chat-form");
  const chatInput = document.getElementById("chat-input");
  let history = [];

  function addMessage(role, text) {
    const row = document.createElement("div");
    row.className = "chat-msg " + role;
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    row.appendChild(bubble);
    chatLog.appendChild(row);
    chatLog.scrollTop = chatLog.scrollHeight;
    return row;
  }

  chatForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const message = chatInput.value.trim();
    if (!message) return;

    addMessage("user", message);
    history.push({ role: "user", content: message });
    chatInput.value = "";
    chatInput.disabled = true;

    const thinkingRow = addMessage("thinking", "Thinking...");

    try {
      const resp = await fetch("/ai/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message, history })
      });
      const data = await resp.json();

      thinkingRow.remove();

      if (data.ok) {
        addMessage("assistant", data.reply);
        history.push({ role: "assistant", content: data.reply });
      } else {
        addMessage("assistant", "Sorry, I couldn't respond: " + (data.error || "unknown error"));
      }
    } catch (err) {
      thinkingRow.remove();
      addMessage("assistant", "Network error — assistant is unreachable.");
    } finally {
      chatInput.disabled = false;
      chatInput.focus();
    }
  });
</script>
{% endblock %}
