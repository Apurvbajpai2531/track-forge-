{% extends "base.html" %}
{% block title %}Sign up · TrackForge{% endblock %}
{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <h1>Create account</h1>
    <p class="auth-subtitle">Start tracking your work with TrackForge</p>
    <form method="POST">
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" required autofocus>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" required>
      </div>
      <div class="form-group">
        <label>Full name <span style="color:var(--muted)">(optional)</span></label>
        <input type="text" name="full_name">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" required>
      </div>
      <button type="submit" class="btn-primary" style="width:100%;justify-content:center;margin-top:8px">Create account</button>
    </form>
    <p class="form-footer">Already have an account? <a href="{{ url_for('login') }}">Sign in</a></p>
  </div>
</div>
{% endblock %}
